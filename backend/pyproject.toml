[project]
name = "pravah-backend"
version = "1.0.0"
description = "PRAVAH — Predictive Regulatory Approval Verification & Assistance Hub"
requires-python = ">=3.12"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
